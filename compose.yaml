name: allrice

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-allrice}
      POSTGRES_USER: ${POSTGRES_USER:-allrice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-allrice}
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-allrice} -d ${POSTGRES_DB:-allrice}',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    command: ['pnpm', 'db:migrate']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-allrice}:${POSTGRES_PASSWORD:-allrice}@postgres:5432/${POSTGRES_DB:-allrice}
    restart: 'no'

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      ALLRICE_ENV: production
      ALLRICE_STORAGE_ROOT: /var/lib/allrice/storage
      ALLRICE_STORAGE_SIGNING_SECRET: ${ALLRICE_STORAGE_SIGNING_SECRET:?set ALLRICE_STORAGE_SIGNING_SECRET to at least 32 random bytes}
      ALLRICE_WEB_PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-allrice}:${POSTGRES_PASSWORD:-allrice}@postgres:5432/${POSTGRES_DB:-allrice}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    volumes:
      - storage-data:/var/lib/allrice/storage

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      ALLRICE_ENV: production
      ALLRICE_WORKER_PORT: 3101
      ALLRICE_WORKER_POLL_INTERVAL_MS: ${ALLRICE_WORKER_POLL_INTERVAL_MS:-1000}
      ALLRICE_WORKER_LEASE_MS: ${ALLRICE_WORKER_LEASE_MS:-30000}
      ALLRICE_WORKER_HEARTBEAT_MS: ${ALLRICE_WORKER_HEARTBEAT_MS:-10000}
      ALLRICE_WORKER_CONCURRENCY: ${ALLRICE_WORKER_CONCURRENCY:-1}
      ALLRICE_EXECUTION_ROOT: /var/lib/allrice/executions
      ALLRICE_STORAGE_ROOT: /var/lib/allrice/storage
      ALLRICE_CODEX_AUTH_HOME: /var/lib/allrice/codex
      ALLRICE_CODEX_COMMAND: codex
      ALLRICE_CODEX_MODEL: ${ALLRICE_CODEX_MODEL:-gpt-5.6-luna}
      ALLRICE_CODEX_REASONING_EFFORT: ${ALLRICE_CODEX_REASONING_EFFORT:-high}
      DATABASE_URL: postgres://${POSTGRES_USER:-allrice}:${POSTGRES_PASSWORD:-allrice}@postgres:5432/${POSTGRES_DB:-allrice}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3101/health/ready').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - storage-data:/var/lib/allrice/storage
      - codex-data:/var/lib/allrice/codex
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    depends_on:
      web:
        condition: service_healthy
    ports:
      - '${ALLRICE_PROXY_PORT:-8080}:8080'
    volumes:
      - ./infra/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    restart: unless-stopped

volumes:
  postgres-data:
  storage-data:
  codex-data:
