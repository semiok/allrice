services:
  office-renderer:
    init: true
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.office-renderer
    ports:
      - '127.0.0.1:3112:3112'
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1
    pids_limit: 128
    restart: unless-stopped
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-allrice}
      POSTGRES_USER: ${POSTGRES_USER:-allrice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-allrice}
    ports:
      - '127.0.0.1:${ALLRICE_DEV_DB_PORT:-54329}:5432'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-allrice} -d ${POSTGRES_DB:-allrice}',
        ]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data

volumes:
  postgres-dev-data:
