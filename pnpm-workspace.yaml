packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  sharp: true

onlyBuiltDependencies:
  - esbuild
  - sharp

# Published UI atoms import React but omit its peer declaration. Bind them to
# the embedding application's React.
# UI conversation declarations import the same-generation nominal-brand helper
# but omit it from runtime dependencies. Only the installed DSH generation may
# appear here: `pnpm dsh:verify` rejects any other @deepseek-ai/dsh version.
packageExtensions:
  # This shared helper executes the platform require itself, outside the entry
  # package's resolver context. Close it without a global override.
  'node-addon-native-custom-loader@0.1.9':
    optionalDependencies:
      node-addon-require-builtin-darwin-arm64: '0.1.9'
      node-addon-require-builtin-darwin-x64: '0.1.9'
      node-addon-require-builtin-linux-arm64-gnu: '0.1.9'
      node-addon-require-builtin-linux-arm64-musl: '0.1.9'
      node-addon-require-builtin-linux-x64-gnu: '0.1.9'
      node-addon-require-builtin-linux-x64-musl: '0.1.9'
      node-addon-require-builtin-win32-arm64-msvc: '0.1.9'
      node-addon-require-builtin-win32-ia32-msvc: '0.1.9'
      node-addon-require-builtin-win32-x64-msvc: '0.1.9'
  # The terminal controller imports these at runtime and in its declarations
  # without listing them. Resolve them inside its own generation. Only its
  # browser entry imports the client store, whose React peer a hard dependency
  # would demand from every host; it is resolved where a workspace provides it.
  '@deepseek-ai/dsh-api-terminal-controller@0.2.1-rc.2':
    dependencies:
      '@deepseek-ai/dsh-agent': 0.2.1-rc.2
      '@deepseek-ai/dsh-api-gateway': 0.2.1-rc.2
      '@deepseek-ai/dsh-brand': 0.2.1-rc.2
      '@deepseek-ai/dsh-session': 0.2.1-rc.2
      '@deepseek-ai/dsh-util-crypto': 0.2.1-rc.2
    peerDependencies:
      '@deepseek-ai/dsh-client-store': 0.2.1-rc.2
    peerDependenciesMeta:
      '@deepseek-ai/dsh-client-store':
        optional: true
  '@deepseek-ai/dsh-client-ui-chat@0.2.1-rc.2':
    dependencies:
      '@deepseek-ai/dsh-client-store': 0.2.1-rc.2
      '@deepseek-ai/dsh-client-ui-conversation': 0.2.1-rc.2
      '@deepseek-ai/dsh-client-ui-primitives': 0.2.1-rc.2
      '@deepseek-ai/cordis': 4.0.5
      '@tanstack/react-virtual': 3.14.9
      react: 19.2.0
      react-dom: 19.2.0
  '@deepseek-ai/dsh-client-ui-conversation@0.2.1-rc.2':
    dependencies:
      '@deepseek-ai/dsh-brand': 0.2.1-rc.2
      '@deepseek-ai/dsh-client-store': 0.2.1-rc.2
      '@deepseek-ai/dsh-client-ui-primitives': 0.2.1-rc.2
      '@deepseek-ai/dsh-util-values': 0.2.1-rc.2
      '@deepseek-ai/cordis': 4.0.5
      react: 19.2.0
      react-dom: 19.2.0
      zod: 4.4.3
  '@deepseek-ai/dsh-client-ui-dockkit@0.2.1-rc.2':
    dependencies:
      '@deepseek-ai/dsh-brand': 0.2.1-rc.2
      '@deepseek-ai/dsh-client-ui-primitives': 0.2.1-rc.2
      clsx: 2.1.1
      react: 19.2.0
      react-dom: 19.2.0
  '@deepseek-ai/dsh-client-ui-primitives@0.2.1-rc.2':
    dependencies:
      '@deepseek-ai/dsh-client-store': 0.2.1-rc.2
      '@deepseek-ai/dsh-util-code-language': 0.2.1-rc.2
      '@deepseek-ai/dsh-util-workspace-path': 0.2.1-rc.2
      '@shikijs/langs': 4.3.1
      anser: 2.3.5
      clsx: 2.1.1
      diff: 9.0.0
      katex: 0.16.47
      mdast-util-from-markdown: 2.0.3
      mdast-util-gfm: 3.1.0
      mdast-util-math: 3.0.0
      micromark-core-commonmark: 2.0.3
      micromark-extension-gfm: 3.0.0
      micromark-extension-math: 3.1.0
      micromark-factory-space: 2.0.1
      micromark-util-character: 2.1.1
      micromark-util-classify-character: 2.0.1
      micromark-util-sanitize-uri: 2.0.1
      micromark-util-symbol: 2.0.1
      react: 19.2.0
      react-dom: 19.2.0
      shiki: 4.3.1
      simple-icons: 16.31.0
  '@deepseek-ai/dsh-client-ui-sidebar-documentpreview@0.2.1-rc.2':
    dependencies:
      '@deepseek-ai/dsh-client-store': 0.2.1-rc.2
      '@deepseek-ai/dsh-client-ui-dockkit': 0.2.1-rc.2
      '@deepseek-ai/dsh-client-ui-primitives': 0.2.1-rc.2
      '@deepseek-ai/cordis': 4.0.5
      dompurify: 3.4.11
      next: 16.2.1
      react: 19.2.0
      react-dom: 19.2.0
  '@deepseek-ai/dsh-client-store@0.2.1-rc.2':
    dependencies:
      immer: 10.1.1
      zustand: 4.4.7
  '@deepseek-ai/dsh-util-code-language@0.2.1-rc.2':
    dependencies:
      diff: 9.0.0

# Pin auto-resolved transitive versions.
overrides:
  # Keep the Office engine on the LibreOffice kit it was verified with.
  '@deepseek-ai/dsh-office-to-pdf@0.2.1-rc.2>@deepseek-ai/libreoffice-kit': 0.1.5
  'zustand@4.4.7>use-sync-external-store': 1.6.0
patchedDependencies:
  'next@16.2.1': patches/next@16.2.1.patch
