  '@deepseek-ai/dsh-sandbox': 0.1.5-rc.3
  '@deepseek-ai/dsh-session-query': 0.1.5-rc.3
  '@deepseek-ai/dsh-session-telemetry': 0.1.5-rc.3
  '@deepseek-ai/dsh-session-title-llm': 0.1.5-rc.3
  '@deepseek-ai/dsh-settings': 0.1.5-rc.3
