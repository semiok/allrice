packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  sharp: true

onlyBuiltDependencies:
  - esbuild
  - sharp

# Published UI atoms import React but omit its peer declaration. Bind them to
# the embedding application's React, rather than pnpm's unrelated hoisted 18.x.
packageExtensions:
  '@deepseek-ai/dsh-client-ui-primitives@0.1.7-rc.1':
    peerDependencies:
      react: '^18.2.0 || ^19.0.0'
      react-dom: '^18.2.0 || ^19.0.0'

# Pin formerly auto-resolved peers to the audited rc.3 graph.
overrides:
  'zustand@4.4.7>use-sync-external-store': 1.6.0
  '@deepseek-ai/dsh-anonymous-user-id': 0.1.5-rc.3
  '@deepseek-ai/dsh-bash-local': 0.1.5-rc.3
  '@deepseek-ai/dsh-code-runtime': 0.1.5-rc.3
  '@deepseek-ai/dsh-compaction': 0.1.5-rc.3
  '@deepseek-ai/dsh-fs': 0.1.5-rc.3
  '@deepseek-ai/dsh-jobs': 0.1.5-rc.3
  '@deepseek-ai/dsh-output-retention': 0.1.5-rc.3
  '@deepseek-ai/dsh-sandbox': 0.1.5-rc.3
  '@deepseek-ai/dsh-session-query': 0.1.5-rc.3
  '@deepseek-ai/dsh-session-telemetry': 0.1.5-rc.3
  '@deepseek-ai/dsh-session-title-llm': 0.1.5-rc.3
  '@deepseek-ai/dsh-settings': 0.1.5-rc.3
  '@deepseek-ai/dsh-shell': 0.1.5-rc.3
  '@deepseek-ai/dsh-spill': 0.1.5-rc.3
  '@deepseek-ai/dsh-subagent-in-process-driver': 0.1.5-rc.3
  '@deepseek-ai/dsh-workflow': 0.1.5-rc.3
patchedDependencies:
  '@deepseek-ai/dsh-client-connection@0.1.5-rc.3': patches/@deepseek-ai__dsh-client-connection@0.1.5-rc.3.patch
  '@deepseek-ai/dsh-session-format-v0-to-v1@0.1.5-rc.3': patches/@deepseek-ai__dsh-session-format-v0-to-v1@0.1.5-rc.3.patch
  '@deepseek-ai/dsh-session-persistence-jsonl@0.1.5-rc.3': patches/@deepseek-ai__dsh-session-persistence-jsonl@0.1.5-rc.3.patch
