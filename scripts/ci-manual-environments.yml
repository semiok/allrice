# Files declare complete CI resource responsibility; tags declare only external leaves.
# {file} commands require the stated isolated prerequisite, never shared Dev.
resources:
  native: []
  manual: []
  db:
    - ALLRICE_RUN_DB_INTEGRATION
  browser:
    - ALLRICE_RUN_BROWSER_INTEGRATION
  browser+db:
    - ALLRICE_RUN_BROWSER_INTEGRATION
    - ALLRICE_RUN_DB_INTEGRATION
  publicHost:
    - ALLRICE_NATIVE_ONCE_PROBE_MODULE_BASE
    - TSX_TSCONFIG_PATH
  build:
    - ALLRICE_RUN_DB_INTEGRATION
    - ALLRICE_P11_NEXT_BUILD
  manual-db:
    - ALLRICE_RUN_DB_INTEGRATION
rules:
  db:
    - packages/database/
    - apps/worker/test/
    - apps/web/lib/identity/
    - tests/integration/
    - scripts/
  browser:
    - apps/web/app/
    - apps/web/components/
    - packages/ui/
    - packages/browser-control/
    - apps/worker/src/browser-control/
  manual:
    - apps/rice-bridge/
    - apps/web/server/
    - apps/worker/src/cloud-runner/
    - apps/worker/src/office/
    - apps/worker/src/repository-repair/
files:
  native:
    - apps/rice-bridge/src/credential-files.test.ts
    - apps/rice-bridge/src/dependency-preparation.test.ts
    - apps/rice-bridge/src/desktop-controller.test.ts
    - apps/rice-bridge/src/desktop-picker.native.test.ts
    - apps/rice-bridge/src/folder-trigger-watcher.test.ts
    - apps/rice-bridge/src/human-terminal-relay.test.ts
    - apps/rice-bridge/src/journal.test.ts
    - apps/rice-bridge/src/local-command-preflight.test.ts
    - apps/rice-bridge/src/native-file-reader.test.ts
    - apps/rice-bridge/src/npm-registry-download.test.ts
    - apps/rice-bridge/src/project-diagnostics.test.ts
    - apps/rice-bridge/src/update-installer.test.ts
    - apps/worker/src/cloud-runner/backend.test.ts
    - apps/worker/src/memory-gate.test.ts
    - apps/worker/test/p25/dsh-images-native.integration.test.ts
    - apps/worker/test/p25/session-reference-native.integration.test.ts
    - apps/worker/test/p25/task-progress-native.integration.test.ts
    - apps/worker/test/p25/task-wait-native.integration.test.ts
    - packages/database/src/platform-content/bundles.test.ts
    - scripts/acceptance/platform/p27-internal-readiness.test.mjs
    - scripts/rice-bridge-pdf-guardian.test.mjs
    - scripts/rice-bridge-terminal-runtime.test.mjs
  manual:
    - apps/rice-bridge/src/local-browser-login.native.test.ts
    - apps/worker/src/browser-control/driver.production.integration.test.ts
    - apps/worker/src/browser-control/static-browser.native.integration.test.ts
    - apps/worker/test/project-runtime.integration.test.ts
    - packages/browser-control/src/local-preview.integration.test.ts
  browser:
    - apps/web/app/chatflow/brand-content-panel.test.tsx
    - apps/web/server/project-preview.test.mjs
  browser+db:
    - apps/web/app/chatflow/reference-library.browser.test.ts
    - apps/web/app/chatflow/work-automation.browser.test.ts
    - apps/web/app/runtime-console/organization-administration.browser.test.ts
    - apps/web/app/runtime-console/tenant-administration.browser.test.ts
    - packages/database/src/runtime-governed-bridge.integration.test.ts
  build:
    - apps/web/server/bridge-socket.test.mjs
  publicHost:
    - apps/worker/src/native-schedule-once.test.ts
  db:
    - apps/web/lib/execution/native-subagent-authorized-query.integration.test.mjs
    - apps/worker/test/final-delivery-references.pg.test.ts
    - packages/database/src/freeze-helpers.transaction.test.ts
    - scripts/acceptance/runtime/p27-codex-worker-fixture.test.ts
  manual-db:
    - apps/worker/test/native-schedule-calendar.integration.test.ts
    - apps/worker/test/native-schedule-monthly.integration.test.ts
    - apps/worker/test/p25/dsh-control-journal-capture.test.ts
    - packages/database/src/desktop-bridge.integration.test.ts
    - packages/database/src/local-browser-native-http.integration.test.ts
    - packages/database/src/local-preview-native-http.integration.test.ts
    - packages/database/src/reconciliation-cloud.integration.test.ts
