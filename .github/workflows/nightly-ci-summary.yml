name: Nightly CI Summary
run-name: Nightly CI ${{ github.event.workflow_run.id }} attempt 1

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  summarize:
    # A separate completed-event workflow also records cancelled scheduled CI.
    if: >-
      always() && github.event.workflow_run.event == 'schedule' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.path == '.github/workflows/ci.yml'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Summarize original scheduled CI without rerunning any gate
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/nightly-ci-summary.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-ci-summary-${{ github.event.workflow_run.id }}-1
          path: .local/nightly-ci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
