name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tenant-workbench-browser:
    runs-on: ubuntu-latest
    # Browser, tenant and organization suites run sequentially. Keep individual
    # test deadlines below while allowing the full expanded suite to finish.
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: allrice
          POSTGRES_PASSWORD: allrice
          POSTGRES_DB: allrice
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U allrice -d allrice"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Capture actual checked-out repository identity
        run: node scripts/acceptance/platform/repository-ci.mjs capture --output=.local/repository-ci/source.json
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @allrice/worker exec playwright-core install --with-deps chromium
      # This first UI step uses isolated loopback responses, without database,
      # model quota, real tenants, Bridge or elevated employee capabilities.
      - name: Verify tenant workspace and composer ownership in Chromium
        env:
          ALLRICE_RUN_BROWSER_INTEGRATION: 1
        run: pnpm exec vitest run --maxWorkers=1 --testTimeout=30000 apps/web/components/admin/admin-shell.browser.test.ts apps/web/app/login/auth-submit.browser.test.ts apps/web/app/chatflow/workbench-layout.browser.test.ts apps/web/app/chatflow/composer-isolation.browser.test.ts apps/web/app/workspace/mcp/connected-apps.browser.test.ts apps/web/app/runtime-console/platform-model-settings.browser.test.ts apps/web/app/runtime-console/codex-subscriptions.browser.test.ts apps/web/app/runtime-console/codex-authorization.browser.test.ts apps/web/app/runtime-console/platform-mcp-settings.browser.test.ts apps/web/app/runtime-console/technical-tasks.browser.test.ts apps/web/app/runtime-console/platform-quality.browser.test.ts apps/web/app/runtime-console/platform-quality-evidence.browser.test.ts apps/web/app/runtime-console/platform-repository-repair.browser.test.ts apps/web/app/runtime-console/platform-repository-publications.browser.test.ts apps/web/app/runtime-console/platform-repository-reviews.browser.test.ts apps/web/app/runtime-console/platform-repository-merges.browser.test.ts apps/web/server/project-preview.test.mjs
      - name: Verify private repository credential write reconciliation
        env:
          ALLRICE_RUN_BROWSER_INTEGRATION: 1
        run: pnpm exec vitest run --maxWorkers=1 apps/web/app/runtime-console/platform-repository-credential.browser.test.ts
      - name: Verify diagnosis-only historical results without repository writes
        env:
          ALLRICE_RUN_BROWSER_INTEGRATION: 1
        run: pnpm exec vitest run --maxWorkers=1 apps/web/app/runtime-console/platform-report-only.browser.test.ts
      - name: Verify tenant management UI, HTTP authorization and PostgreSQL persistence
        # Synthetic principals in disposable schemas, never real tenant permissions.
        env:
          ALLRICE_RUN_DB_INTEGRATION: 1
          ALLRICE_RUN_BROWSER_INTEGRATION: 1
          ALLRICE_TEST_DATABASE_URL: postgres://allrice:allrice@127.0.0.1:54329/allrice
        run: pnpm exec vitest run --maxWorkers=1 --testTimeout=30000 packages/database/src/tenant-administration.integration.test.ts packages/database/src/tenant-employees.integration.test.ts packages/database/src/tenant-inheritance.integration.test.ts packages/database/src/employee-administration.integration.test.ts packages/database/src/tenant-resources.integration.test.ts packages/database/src/tenant-validation.integration.test.ts packages/database/src/user-monthly-quota.integration.test.ts packages/database/src/user-preferences.integration.test.ts apps/web/app/runtime-console/tenant-administration.browser.test.ts apps/web/app/chatflow/work-automation.browser.test.ts packages/database/src/work-automation.integration.test.ts packages/database/src/workspace/session-references.integration.test.ts
      - name: Verify organization and employee account management in Chromium
        env:
          ALLRICE_RUN_DB_INTEGRATION: 1
          ALLRICE_RUN_BROWSER_INTEGRATION: 1
          ALLRICE_TEST_DATABASE_URL: postgres://allrice:allrice@127.0.0.1:54329/allrice
        run: pnpm exec vitest run --maxWorkers=1 --testTimeout=30000 packages/database/src/organization-administration.integration.test.ts packages/database/src/organization-employee-assignments.integration.test.ts packages/database/src/organization-publication.integration.test.ts packages/database/src/organization-activity.integration.test.ts packages/database/src/organization-migration.integration.test.ts apps/web/app/runtime-console/organization-administration.browser.test.ts
      - name: Verify formal partial-delivery and preview facts in Chromium
        # Same real queue/Worker/Broker/PG/HTTP as the API matrix; only these two
        # UI cases are repeated. Deterministic adapters use no paid model/device.
        env:
          ALLRICE_RUN_DB_INTEGRATION: 1
          ALLRICE_RUN_BROWSER_INTEGRATION: 1
          ALLRICE_TEST_DATABASE_URL: postgres://allrice:allrice@127.0.0.1:54329/allrice
        run: pnpm exec vitest run --maxWorkers=1 tests/integration/platform-quality-delivery.integration.test.ts -t 'one available file|pending and failed'
      - name: Record complete original CI gate
        run: node scripts/acceptance/platform/repository-ci.mjs finish --capture=.local/repository-ci/source.json --output=.local/repository-ci/receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: repository-ci-${{ github.job }}-${{ github.run_attempt }}
          path: .local/repository-ci/receipt.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Capture actual checked-out repository identity
        run: node scripts/acceptance/platform/repository-ci.mjs capture --output=.local/repository-ci/source.json
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dsh:verify
      - run: pnpm dsh-ui:verify
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # Cross-app tests must not become production Web dependency edges.
      - run: pnpm exec tsc -p tests/integration/tsconfig.json
      # Native child processes and fsync journals need bounded contention.
      - name: Capture versioned deterministic regression source
        id: native-capture
        run: pnpm exec tsx scripts/acceptance/platform/quality-scenarios.ts capture --group=native --output=.local/quality/native/capture.json
      - name: Run existing tests and retain their original evidence
        id: native-tests
        run: pnpm test --maxWorkers=2 --reporter=default --reporter=json --outputFile=.local/quality/native/vitest-native.json
      - name: Collect deterministic scenario evidence without rerunning tests
        if: always() && steps.native-capture.outcome == 'success'
        env:
          TEST_EXIT: ${{ steps.native-tests.outcome == 'success' && '0' || '1' }}
        run: pnpm exec tsx scripts/acceptance/platform/quality-scenarios.ts collect --capture=.local/quality/native/capture.json --report=.local/quality/native/vitest-native.json --exit-code=$TEST_EXIT --output=.local/quality/native/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deterministic-quality-evidence
          path: .local/quality/native/
          include-hidden-files: true
          retention-days: 14
      - name: Build all workspace production packages
        id: workspace-build
        run: pnpm build
      - name: Record complete original CI gate
        run: node scripts/acceptance/platform/repository-ci.mjs finish --capture=.local/repository-ci/source.json --output=.local/repository-ci/receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: repository-ci-${{ github.job }}-${{ github.run_attempt }}
          path: .local/repository-ci/receipt.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  developer-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Capture actual checked-out repository identity
        run: node scripts/acceptance/platform/repository-ci.mjs capture --output=.local/repository-ci/source.json
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm doctor:ci
      - run: pnpm db:setup
      - name: Capture versioned PostgreSQL regression source
        id: postgres-capture
        run: pnpm exec tsx scripts/acceptance/platform/quality-scenarios.ts capture --group=postgres --output=.local/quality/postgres/capture.json
      - name: Verify platform content synchronization against PostgreSQL
        env:
          ALLRICE_RUN_DB_INTEGRATION: 1
          DATABASE_URL: postgres://allrice:allrice@127.0.0.1:54329/allrice
        run: pnpm exec vitest run packages/database/src/platform-content/sync.integration.test.ts
      - name: Verify shared operation ledger against PostgreSQL
        env:
          ALLRICE_RUN_DB_INTEGRATION: 1
          ALLRICE_TEST_DATABASE_URL: postgres://allrice:allrice@127.0.0.1:54329/allrice
        run: pnpm exec vitest run packages/database/src/runtime-ledger/ledger.integration.test.ts
      - name: Verify unified account login and password lifecycle
        env:
          ALLRICE_RUN_DB_INTEGRATION: 1
          ALLRICE_TEST_DATABASE_URL: postgres://allrice:allrice@127.0.0.1:54329/allrice
        run: pnpm exec vitest run --maxWorkers=2 packages/database/src/unified-login.integration.test.ts apps/web/lib/identity/unified-login.integration.test.ts
      - name: Verify Worker capability heartbeats and actual tenant publications
        env:
          ALLRICE_RUN_DB_INTEGRATION: 1
          ALLRICE_TEST_DATABASE_URL: postgres://allrice:allrice@127.0.0.1:54329/allrice
        run: pnpm exec vitest run packages/database/src/providers/runtime-capabilities.integration.test.ts packages/database/src/providers/codex-subscriptions.integration.test.ts
      - name: Verify MET-153 durable task time and approval resume against PostgreSQL
        env:
          ALLRICE_RUN_DB_INTEGRATION: 1
          ALLRICE_TEST_DATABASE_URL: postgres://allrice:allrice@127.0.0.1:54329/allrice
        run: pnpm exec vitest run --maxWorkers=1 --reporter=default --reporter=json --outputFile=.local/quality/postgres/vitest-task.json packages/database/src/session-archive.integration.test.ts packages/database/src/task-clock.integration.test.ts packages/database/src/execution-diagnostics.integration.test.ts packages/database/src/operations-resources.integration.test.ts packages/database/src/task-progress.integration.test.ts packages/database/src/task-native-wait.integration.test.ts apps/worker/test/p25/task-wait-worker.integration.test.ts
      - name: Verify governed Bridge policy and real HTTP journal integration
        env:
          ALLRICE_RUN_DB_INTEGRATION: 1
          ALLRICE_TEST_DATABASE_URL: postgres://allrice:allrice@127.0.0.1:54329/allrice
        run: pnpm exec vitest run packages/database/src/bridge-presence.integration.test.ts packages/database/src/runtime-policy.integration.test.ts packages/database/src/runtime-governed-bridge.integration.test.ts packages/database/src/runtime-ledger/bridge-http.integration.test.ts packages/database/src/local-python-execution.integration.test.ts packages/database/src/python-execution.integration.test.ts
      - name: Verify Gemini draft compatibility against PostgreSQL
        env:
          ALLRICE_RUN_DB_INTEGRATION: 1
          ALLRICE_TEST_DATABASE_URL: postgres://allrice:allrice@127.0.0.1:54329/allrice
        run: pnpm exec vitest run packages/database/src/gemini-compatibility.integration.test.ts
      - name: Verify MCP employee binding, native DSH, per-tool authorization and real HTTP ledger
        env:
          ALLRICE_RUN_DB_INTEGRATION: 1
          ALLRICE_TEST_DATABASE_URL: postgres://allrice:allrice@127.0.0.1:54329/allrice
        # These suites use their own synthetic MCP server and random PG schemas.
        # This Linux CI job does not provision the dedicated macOS/runsc test VM.
        run: pnpm exec vitest run --reporter=default --reporter=json --outputFile=.local/quality/postgres/vitest-mcp.json packages/database/src/mcp-connections.integration.test.ts packages/database/src/mcp-http.integration.test.ts packages/database/src/mcp-execution.integration.test.ts packages/database/src/cloud-execution.integration.test.ts packages/database/src/cloud-python.integration.test.ts packages/database/src/workspace-access.integration.test.ts tests/integration/mcp-revocation.integration.test.ts
      - name: Verify platform model inheritance and image receipts
        env:
          ALLRICE_RUN_DB_INTEGRATION: 1
          ALLRICE_TEST_DATABASE_URL: postgres://allrice:allrice@127.0.0.1:54329/allrice
        run: pnpm exec vitest run --maxWorkers=1 packages/database/src/platform-model-settings.integration.test.ts apps/worker/test/met163/image-generation.integration.test.ts
      - name: Verify frozen Skill bundles and rollback against PostgreSQL
        env:
          ALLRICE_RUN_DB_INTEGRATION: 1
          ALLRICE_TEST_DATABASE_URL: postgres://allrice:allrice@127.0.0.1:54329/allrice
        run: pnpm exec vitest run packages/database/src/skill-bundles.integration.test.ts packages/database/src/platform-skill-publication.integration.test.ts
      - name: Verify fixed company publications, Run inputs and derived outputs
        env:
          ALLRICE_RUN_DB_INTEGRATION: 1
          ALLRICE_TEST_DATABASE_URL: postgres://allrice:allrice@127.0.0.1:54329/allrice
        run: pnpm exec vitest run --maxWorkers=1 --reporter=default --reporter=json --outputFile=.local/quality/postgres/vitest-company.json packages/database/src/company-assets.integration.test.ts packages/database/src/company-run-assets.integration.test.ts packages/database/src/company-deliverables.integration.test.ts packages/database/src/local-pdf-execution.integration.test.ts packages/database/src/office-pdf-execution.integration.test.ts
      - name: Verify P19 frozen script authority and acceptance SQL against PostgreSQL
        env:
          ALLRICE_RUN_DB_INTEGRATION: 1
          ALLRICE_TEST_DATABASE_URL: postgres://allrice:allrice@127.0.0.1:54329/allrice
        # These checks do not require a VM or spend model budget.
        run: pnpm exec vitest run packages/database/src/frozen-cloud-script.integration.test.ts packages/database/src/reconciliation-audit.integration.test.ts
      - name: Verify B5 local MCP, experience, browser and preview authority against PostgreSQL
        env:
          ALLRICE_RUN_DB_INTEGRATION: 1
          ALLRICE_TEST_DATABASE_URL: postgres://allrice:allrice@127.0.0.1:54329/allrice
        # Native Chrome/VM and final macOS package gates have separate physical
        # evidence; this step must not advertise those skipped gates as passed.
        run: pnpm exec vitest run --reporter=default --reporter=json --outputFile=.local/quality/postgres/vitest-local.json packages/database/src/local-mcp.integration.test.ts packages/database/src/experience.integration.test.ts packages/database/src/message-feedback.integration.test.ts packages/database/src/browser-control.integration.test.ts packages/database/src/local-browser.integration.test.ts packages/database/src/browser-execution-choice.integration.test.ts packages/database/src/local-files.integration.test.ts packages/database/src/folder-triggers.integration.test.ts packages/database/src/local-preview.integration.test.ts packages/database/src/storage-quota.integration.test.ts packages/database/src/browser-operation-locks.integration.test.ts
      - name: Verify B6 assistant authority, output grants and native dispatch against PostgreSQL
        # B6 model endpoints are synthetic loopback services. This step does not
        # use provider keys, tenants, native macOS devices or release credentials.
        # Run it explicitly with PostgreSQL; ordinary tests gate these suites off.
        env:
          ALLRICE_RUN_DB_INTEGRATION: 1
          ALLRICE_TEST_DATABASE_URL: postgres://allrice:allrice@127.0.0.1:54329/allrice
        run: pnpm exec vitest run --maxWorkers=1 packages/database/src/assistant-authority.integration.test.ts packages/database/src/assistant-current-authority.integration.test.ts packages/database/src/assistant-runtime.integration.test.ts packages/database/src/assistant-failure-usage.integration.test.ts packages/database/src/development-cooperation.integration.test.ts packages/database/src/development-workflow.integration.test.ts packages/database/src/assistant-output.integration.test.ts packages/database/src/assistant-preference.integration.test.ts packages/database/src/local-command-assistant.integration.test.ts packages/database/src/local-command-candidate.integration.test.ts packages/database/src/route-usage-unknown.integration.test.ts packages/database/src/assistant-output-budget.integration.test.ts packages/database/src/assistant-model-admission.integration.test.ts packages/database/src/assistant-pricing.integration.test.ts packages/database/src/assistant-quota-admission.integration.test.ts apps/worker/test/p25
      - name: Verify private project snapshots and version conflicts against PostgreSQL
        env:
          ALLRICE_RUN_DB_INTEGRATION: 1
          ALLRICE_TEST_DATABASE_URL: postgres://allrice:allrice@127.0.0.1:54329/allrice
        run: pnpm exec vitest run packages/database/src/project-workspace.integration.test.ts packages/database/src/project-execution.integration.test.ts packages/database/src/static-browser.integration.test.ts packages/database/src/project-service.integration.test.ts packages/database/src/cloud-project-service.integration.test.ts
      - name: Verify platform technical facts, problem evidence and authority against PostgreSQL
        id: postgres-quality
        env:
          ALLRICE_RUN_DB_INTEGRATION: 1
          ALLRICE_TEST_DATABASE_URL: postgres://allrice:allrice@127.0.0.1:54329/allrice
        # Separate synthetic schemas; no actual provider, host control or company data.
        run: pnpm exec vitest run --maxWorkers=1 --reporter=default --reporter=json --outputFile=.local/quality/postgres/vitest-quality.json packages/database/src/dev-release-control.integration.test.ts packages/database/src/dev-maintenance.integration.test.ts packages/database/src/platform-technical.integration.test.ts packages/database/src/platform-technical-tasks.integration.test.ts packages/database/src/platform-quality.integration.test.ts packages/database/src/platform-repair.integration.test.ts packages/database/src/platform-repository-credentials.integration.test.ts packages/database/src/platform-repository-publication.integration.test.ts packages/database/src/browser-lifecycle.integration.test.ts packages/database/src/artifact-publication-concurrency.integration.test.ts tests/integration/platform-quality-conversation.integration.test.ts tests/integration/platform-quality-delivery.integration.test.ts
      - name: Collect PostgreSQL scenario evidence without rerunning tests
        if: always() && steps.postgres-capture.outcome == 'success'
        env:
          TEST_EXIT: ${{ steps.postgres-quality.outcome == 'success' && '0' || '1' }}
        run: pnpm exec tsx scripts/acceptance/platform/quality-scenarios.ts collect --capture=.local/quality/postgres/capture.json --reports-dir=.local/quality/postgres --exit-code=$TEST_EXIT --output=.local/quality/postgres/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-quality-evidence
          path: .local/quality/postgres/
          include-hidden-files: true
          retention-days: 14
      - name: Verify Codex subscription lifecycle and incremental migration without credentials
        # MET-144 checks 0100 -> 0101 -> 0102 separately without a public-schema fallback.
        # Real isolated PG and pinned native runtime; the HTTP model endpoint
        # is a controlled loopback fixture, never a real Codex or API account.
        env:
          ALLRICE_RUN_DB_INTEGRATION: 1
          ALLRICE_TEST_DATABASE_URL: postgres://allrice:allrice@127.0.0.1:54329/allrice
          TSX_TSCONFIG_PATH: ${{ github.workspace }}/tsconfig.base.json
        run: pnpm exec vitest run --maxWorkers=1 packages/database/src/development-cooperation-migration.integration.test.ts packages/database/src/subscription-migration-recovery.integration.test.ts packages/database/src/providers/status.integration.test.ts packages/database/src/route-subscription.integration.test.ts scripts/acceptance/runtime/p27-codex-worker-fixture.test.ts scripts/acceptance/runtime/p27-codex-lifecycle.test.ts scripts/acceptance/runtime/p27-codex-assistants-verification.test.ts
      - name: Build contracts, database and Web for real Bridge startup verification
        run: pnpm --filter @allrice/web... build
      - name: Verify real Bridge WSS, PostgreSQL and production Next startup
        env:
          ALLRICE_RUN_DB_INTEGRATION: 1
          ALLRICE_P11_NEXT_BUILD: 1
          ALLRICE_TEST_DATABASE_URL: postgres://allrice:allrice@127.0.0.1:54329/allrice
        run: pnpm exec vitest run apps/web/server/bridge-socket.test.mjs
      - name: Stop development database
        if: always()
        run: pnpm db:dev:down
      - name: Record complete original CI gate
        run: node scripts/acceptance/platform/repository-ci.mjs finish --capture=.local/repository-ci/source.json --output=.local/repository-ci/receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: repository-ci-${{ github.job }}-${{ github.run_attempt }}
          path: .local/repository-ci/receipt.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/checkout@v4
      - name: Capture actual checked-out repository identity
        run: node scripts/acceptance/platform/repository-ci.mjs capture --output=.local/repository-ci/source.json
      - run: bash scripts/compose-smoke.sh
      - name: Record complete original CI gate
        run: node scripts/acceptance/platform/repository-ci.mjs finish --capture=.local/repository-ci/source.json --output=.local/repository-ci/receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: repository-ci-${{ github.job }}-${{ github.run_attempt }}
          path: .local/repository-ci/receipt.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
